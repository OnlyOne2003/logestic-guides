<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>راهنماها</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#5b6475; --accent:#2563eb; --border:#e3e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e8ebf0; --muted:#9aa3b2; --accent:#60a5fa; --border:#2a313d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Tahoma, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.6rem; margin:0 0 24px; }
  a.card { display:block; background:var(--card); border:1px solid var(--border); border-radius:12px;
           padding:18px 20px; margin-bottom:12px; color:var(--text); text-decoration:none; }
  a.card:hover { border-color:var(--accent); }
  a.card strong { display:block; font-size:1.1rem; margin-bottom:4px; color:var(--accent); }
  a.card span { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>راهنماها</h1>
  <a class="card" href="admin-guide.html"><strong>معرفی پنل مدیریت</strong><span>راهنمای مدیران سامانه</span></a>
  <a class="card" href="driver-guide.html"><strong>راهنمای اپ راننده</strong><span>راهنمای استفاده از اپلیکیشن راننده</span></a>
  <a class="card" href="passenger-guide.html"><strong>راهنمای اپ مسافر</strong><span>راهنمای استفاده از اپلیکیشن مسافر</span></a>
</main>
</body>
</html>
